openapi: 3.1.0

# Contract sketch for the Phase 3 backend.
#
# This is written NOW, during Phase 1, so the JSON shape the frontend already
# consumes is the same shape the API will return — no adaptation layer later.
# The schemas below mirror frontend/src/lib/schema.ts. Keep them in step.
#
# NOT YET IMPLEMENTED. See tasks.md P3-01/P3-02.

info:
  title: Portfolio API
  version: 0.1.0
  description: |
    Read-only endpoints backing the portfolio site.

    Phase 3 serves these from the same JSON files the static provider uses.
    Phase 4 moves the storage to Postgres without changing any response shape.

    There is no authentication: every endpoint returns public portfolio content
    and is reachable only through the nginx /api/ proxy on the same origin.
    That holds only while the API stays read-only — any write endpoint requires
    auth first. See decisions/0005-fastapi-postgres-later-phases.md

servers:
  - url: /api
    description: Same-origin, proxied by nginx
  - url: http://localhost:8000/api
    description: Backend directly, for local development

paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

  /profile:
    get:
      summary: Profile, bio, and social links
      operationId: getProfile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /projects:
    get:
      summary: All projects, already enriched with GitHub stats
      operationId: listProjects
      description: |
        Returned in display order: featured first, then by `order`, then title.
        The frontend does not re-sort.
      responses:
        '200':
          description: Projects in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrichedProject'

  /projects/{slug}:
    get:
      summary: A single project
      operationId: getProject
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedProject'
        '404':
          description: No project with that slug

  /experience:
    get:
      summary: Work and education history
      operationId: listExperience
      description: Most recent first; ongoing entries sort to the top.
      responses:
        '200':
          description: Experience entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'

  /skills:
    get:
      summary: Skill groups
      operationId: listSkills
      responses:
        '200':
          description: Skill groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillGroup'

components:
  schemas:
    SocialLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string, format: uri }
        handle: { type: string }

    Profile:
      type: object
      required: [name, githubUsername, role, tagline, about, socials, needsContent]
      properties:
        name: { type: string }
        githubUsername: { type: string }
        role: { type: string }
        tagline: { type: string }
        location: { type: string }
        email: { type: string, format: email }
        availability: { type: string }
        about:
          type: array
          items: { type: string }
          minItems: 1
        socials:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        seo:
          type: object
          required: [title, description]
          properties:
            title: { type: string }
            description: { type: string }
            siteUrl: { type: string, format: uri }
        needsContent: { type: boolean }

    ProjectStatus:
      type: string
      enum: [active, maintenance, archived, experiment, planned]

    Project:
      type: object
      required: [slug, title, blurb, description, stack, highlights, status, featured, order, needsContent]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title: { type: string }
        blurb: { type: string, maxLength: 240 }
        description:
          type: array
          items: { type: string }
        stack:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { type: string }
        role: { type: string }
        year:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
        status: { $ref: '#/components/schemas/ProjectStatus' }
        featured: { type: boolean }
        order: { type: integer }
        repo:
          type: string
          pattern: '^[\w.-]+/[\w.-]+$'
          description: '"owner/name" — links the project to its GitHub stats'
        repoUrl: { type: string, format: uri }
        liveUrl: { type: string, format: uri }
        needsContent: { type: boolean }

    GitHubRepoStats:
      type: object
      description: Live facts pulled from GitHub. Never hand-authored.
      required: [fullName, name, url, pushedAt, createdAt]
      properties:
        fullName: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        url: { type: string, format: uri }
        homepage: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        topics:
          type: array
          items: { type: string }
        stars: { type: integer, minimum: 0 }
        forks: { type: integer, minimum: 0 }
        openIssues: { type: integer, minimum: 0 }
        pushedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }
        isFork: { type: boolean }
        license: { type: [string, 'null'] }
        languages:
          type: object
          additionalProperties: { type: integer }
          description: Bytes per language

    EnrichedProject:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [github, resolvedRepoUrl]
          properties:
            github:
              oneOf:
                - $ref: '#/components/schemas/GitHubRepoStats'
                - type: 'null'
            resolvedRepoUrl:
              type: [string, 'null']
              description: Explicit repoUrl, else derived from `repo`, else null

    Experience:
      type: object
      required: [id, role, org, kind, start, highlights, stack, needsContent]
      properties:
        id: { type: string }
        role: { type: string }
        org: { type: string }
        orgUrl: { type: string, format: uri }
        kind:
          type: string
          enum: [work, education, other]
        start:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
        end:
          type: string
          pattern: '^\d{4}(-\d{2}){0,2}$'
          description: Absent means ongoing — the UI renders "Present"
        location: { type: string }
        summary: { type: string }
        highlights:
          type: array
          items: { type: string }
        stack:
          type: array
          items: { type: string }
        needsContent: { type: boolean }

    SkillGroup:
      type: object
      required: [category, items]
      properties:
        category: { type: string }
        items:
          type: array
          items: { type: string }
          minItems: 1
        note: { type: string }
