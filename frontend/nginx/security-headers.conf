# Security headers, kept in one file because nginx's add_header inheritance is
# a trap: directives are inherited from the enclosing block ONLY IF the current
# block declares no add_header of its own. Any location that sets a
# Cache-Control header would therefore silently drop all of these.
#
# So: every location that calls add_header also includes this file.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 'unsafe-inline' is required because the build emits no external JS at all:
# Astro inlines the theme toggle and project filter as <script type="module">
# blocks in the HTML, alongside the pre-paint theme script and its own scoped
# <style> blocks. Verified against dist/ — zero .js files, three inline scripts.
#
# Tightening this to per-build hashes is possible but has to happen after the
# build emits its final output — noted as a possible improvement, not done.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
