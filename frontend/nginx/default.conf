# ngrok terminates TLS and forwards over the internal network, so the real
# client IP arrives in X-Forwarded-For rather than $remote_addr.
#
# This sits OUTSIDE the server block on purpose: log_format is only valid in the
# http context, and nginx.conf includes conf.d/*.conf from inside http. Placing
# it in the server block fails `nginx -t` with "directive is not allowed here".
log_format tunnel '$http_x_forwarded_for - "$request" $status '
                  '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log tunnel;

    # ─── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ─── Health check ───────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # ─── Caching ────────────────────────────────────────────────────────────
    # Astro content-hashes everything under /_astro/, so those files can never
    # change under a given name — cache them hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Self-hosted fonts are also content-addressed by the bundler.
    location ~* \.(woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ─── Routing ────────────────────────────────────────────────────────────
    # Astro builds with format: 'directory', so /projects/foo/ maps to
    # /projects/foo/index.html. The $uri/ term handles a missing trailing slash.
    #
    # HTML must revalidate: a rebuilt site would otherwise keep serving cached
    # pages that reference asset hashes which no longer exist. This lives here
    # rather than in a `\.html$` location because directory-format URLs end in
    # `/`, not `.html`, so a suffix match would never fire for them.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ─── Phase 3: backend proxy ─────────────────────────────────────────────
    # Uncomment together with adding the `api` service to docker-compose.yml.
    # Keeping the API same-origin means no CORS configuration is needed.
    #
    # location /api/ {
    #     proxy_pass http://api:8000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout 30s;
    #     include /etc/nginx/snippets/security-headers.conf;
    # }

    # Hidden files (.git, .env) should never be reachable even by accident.
    location ~ /\. {
        deny all;
        access_log off;
    }
}
